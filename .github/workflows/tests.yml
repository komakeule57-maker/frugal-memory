# Regressionsnetz auf Linux, macOS und Windows, jeweils mit der kleinsten und
# der neuesten unterstuetzten Python-Fassung. Entwickelt wird nur auf Linux;
# ob es woanders laeuft, soll ein Lauf zeigen, nicht eine Vermutung.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      # Ein Ausfall auf einem System soll die anderen nicht abbrechen -
      # gerade die Zeile, die scheitert, ist die Auskunft.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Die einzige Annahme ueber die Plattform: SQLite mit FTS5 und
      # fts5vocab. Steht hier im Protokoll, falls ein Test daran scheitert.
      - name: SQLite und FTS5
        shell: bash
        run: |
          python -c "
          import sqlite3, sys
          c = sqlite3.connect(':memory:')
          print(sys.platform, sys.version.split()[0], 'SQLite', sqlite3.sqlite_version)
          c.execute('CREATE VIRTUAL TABLE t USING fts5(x)')
          c.execute('CREATE VIRTUAL TABLE v USING fts5vocab(t, col)')
          print('fts5 und fts5vocab vorhanden')
          "

      - name: Abhaengigkeiten
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Regressionsnetz
        shell: bash
        run: python test_memory.py

      - name: Erweiterungen (Archiv, Messbuch)
        shell: bash
        run: |
          python test_archiv.py
          python test_messbuch.py

      # Das Paket so, wie es von PyPI kommt: gebaut, in eine frische Umgebung
      # installiert, die Befehle aufgerufen. Faengt fehlende Module und
      # Paketdaten, die das Regressionsnetz im Quellordner nie sieht.
      - name: Paket bauen und installiert pruefen
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/frugal-memory-skill" --ziel "$RUNNER_TEMP/skills"
          test -s "$RUNNER_TEMP/skills/frugal-memory/SKILL.md"
          "$BIN/python" -c "import memory_server as m; print('frugal-memory', m.__version__)"
          "$BIN/python" -c "import sys, memory_server as m; sys.argv += ['--messbuch']; m.server.run = lambda **k: None; m.main(); print(sorted(t.name for t in m.server._tool_manager.list_tools()))"
          "$BIN/python" -c "import sys, memory_server as m; sys.argv += ['--archiv']; m.server.run = lambda **k: None; m.main(); print(m.DB_PATH)"
